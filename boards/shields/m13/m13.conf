CONFIG_BT_DEVICE_NAME="M13"
CONFIG_USB_DEVICE_PRODUCT="M13 USB"
CONFIG_ZMK_KEYBOARD_NAME="m13"

CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9


# Trackpoint (zmk-trackpoint module); selects INPUT and ZMK_POINTING
CONFIG_TRACKPOINT=y
CONFIG_INPUT_INIT_PRIORITY=99

CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=60000

CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

CONFIG_ZMK_BATTERY_REPORT_INTERVAL=30

CONFIG_STATUS_LED=y

CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_PS2_LOG_LEVEL_DBG=n
CONFIG_PS2_LOG_LEVEL_WRN=y
CONFIG_UART_LOG_LEVEL_DBG=y
CONFIG_LOG_MODE_IMMEDIATE=n

# CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=20000
CONFIG_LOG_BUFFER_SIZE=16384